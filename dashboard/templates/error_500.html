<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Diagnostic Notice | Marvan Aegis-Quant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-lg w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl text-center">
        <div class="text-amber-400 text-5xl mb-4">⚠️</div>
        <h1 class="text-2xl font-bold mb-2 text-amber-300">System Initializing...</h1>
        <p class="text-gray-400 text-sm mb-6">The Aegis-Quant AI Engine is synchronizing live feeds. If this takes more than 10 seconds, click refresh below.</p>
        <div class="bg-gray-950 border border-gray-800 rounded-xl p-4 text-left text-xs font-mono text-gray-300 mb-6 overflow-x-auto">
            {{ error_details | default('Syncing market feeds...') }}
        </div>
        <a href="/" class="inline-block bg-amber-500 hover:bg-amber-400 text-black font-black px-6 py-3 rounded-xl text-sm transition">
            🔄 Refresh Dashboard
        </a>
    </div>
</body>
</html>
